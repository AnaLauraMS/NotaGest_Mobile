name: Release Mobile

on:
  push:
    branches:
      - main
      - development
      - feat/story-book

permissions:
  contents: write

jobs:
  ci-test-and-build:
    name: Continuous Integration & Delivery (Mobile)
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install --legacy-peer-deps

      - name: Executar testes automatizados (AAA) com cobertura
        run: npm run test:coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Login no Docker Hub
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development' || github.ref == 'refs/heads/feat/story-book')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Instalar semver
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/story-book'
        run: npm install -g semver

      - name: Criar tag inicial (se não existir)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/story-book'
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          if [ -z "$(git tag -l 'v*')" ]; then
            git tag -a v0.0.0 -m "Initial mobile release"
            git push origin v0.0.0
          fi

      - name: Calcular versão semântica
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/story-book'
        id: version
        run: |
          LAST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
          if [ -z "$LAST_TAG" ]; then
            LAST_TAG="v0.0.0"
          fi
          echo "Última tag válida: $LAST_TAG"
          CURRENT_VERSION=${LAST_TAG#v}

          COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"%s")

          MAJOR=0
          MINOR=0
          PATCH=0

          for COMMIT in "$COMMITS"; do
            if [[ "$COMMIT" == *"BREAKING CHANGE"* ]]; then
              MAJOR=1
            elif [[ "$COMMIT" == *"feat"* ]]; then
              MINOR=1
            elif [[ "$COMMIT" == *"fix"* ]]; then
              PATCH=1
            fi
          done

          NEW_VERSION=$CURRENT_VERSION
          if [[ $MAJOR -eq 1 ]]; then
            NEW_VERSION=$(semver -i major $CURRENT_VERSION)
          elif [[ $MINOR -eq 1 ]]; then
            NEW_VERSION=$(semver -i minor $CURRENT_VERSION)
          elif [[ $PATCH -eq 1 ]]; then
            NEW_VERSION=$(semver -i patch $CURRENT_VERSION)
          else
            NEW_VERSION=$(semver -i patch $CURRENT_VERSION)
          fi

          echo "Nova versão Mobile: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_ENV

      - name: Atualizar versão no package.json
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/story-book'
        run: |
          npm version ${{ env.new_version }} --no-git-tag-version

      - name: Commit e push da tag de release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/story-book'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add package.json
          if git diff --cached --quiet; then
            echo "Sem alterações para commit no package.json"
          else
            git commit -m "chore(release): version ${{ env.new_version }}"
          fi

          if git rev-parse v${{ env.new_version }} >/dev/null 2>&1; then
            echo "Tag v${{ env.new_version }} já existe."
          else
            git tag v${{ env.new_version }}
          fi
          git push origin HEAD --tags

      - name: Build e Push da Imagem Docker (Development)
        if: github.ref == 'refs/heads/development' || github.ref == 'refs/heads/feat/story-book'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/notagest-mobile:dev

      - name: Build e Push da Imagem Docker (Production / Main)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/notagest-mobile:latest
            ${{ secrets.DOCKER_USERNAME }}/notagest-mobile:v${{ env.new_version }}

      - name: Enviar e-mail de falha
        uses: dawidd6/action-send-mail@v3
        if: failure()
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_ORIGEM }}
          password: ${{ secrets.SENHA_EMAIL }}
          subject: Falha no Pipeline Mobile - ${{ github.repository }}
          to: ${{ secrets.EMAIL_DESTINO }}
          from: ${{ secrets.EMAIL_ORIGEM }}

  deploy-hml:
    name: Deploy - Homologação (Mobile HML)
    needs: ci-test-and-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development' || github.ref == 'refs/heads/feat/story-book'
    environment:
      name: hml
    runs-on: ubuntu-latest
    steps:
      - name: Notificar disponibilização de Build HML
        run: |
          echo "Imagem Docker Mobile de Homologação disponível no Docker Hub: notagest-mobile:dev"

  deploy-prod:
    name: Deploy - Produção (Mobile PROD)
    needs: [ci-test-and-build, deploy-hml]
    if: github.ref == 'refs/heads/main'
    environment:
      name: prod
    runs-on: ubuntu-latest
    steps:
      - name: Notificar disponibilização de Release PROD
        run: |
          echo "Imagem Docker Mobile de Produção disponível no Docker Hub: notagest-mobile:latest"
