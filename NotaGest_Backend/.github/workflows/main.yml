name: Release

on:
  push:
    branches:
      - main
      - development
      - feat/story-book

permissions:
  contents: write

jobs:
  ci-test:
    name: Continuous Integration (CI)
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install

      - name: Rodar build
        run: npm run build

      # 🐳 DOCKER LOGIN
      - name: Login no Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Testes unitarios
        run: npm test -- --coverage

      # 🔍 SONAR CLOUD SCAN
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Instalar semver
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/story-book'
        run: npm install -g semver

      - name: Criar nova tag caso não exista
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/story-book'
        id: create_initial_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          if [ -z "$(git tag)" ]; then
            git tag -a v0.0.0 -m "Initial release"
            git push origin v0.0.0
          fi

      - name: Calcular nova versão
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/story-book'
        id: version
        run: |
          # Busca a última tag que segue o padrão vX.X.X
          LAST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
          
          if [ -z "$LAST_TAG" ] || [ "$LAST_TAG" = "v" ]; then
            LAST_TAG="v0.0.0"
          fi
          
          echo "Versão Atual: $LAST_TAG"
          
          if [ "$LAST_TAG" = "v0.0.0" ]; then
            COMMITS=$(git log --pretty=format:"%s")
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"%s")
          fi
          
          MAJOR=0
          MINOR=0
          PATCH=0
          
          for COMMIT in "$COMMITS"; do
            if [[ "$COMMIT" == *"BREAKING CHANGE"* ]]; then
              MAJOR=1
            elif [[ "$COMMIT" == *"feat"* ]]; then
              MINOR=1
            elif [[ "$COMMIT" == *"fix"* ]]; then
              PATCH=1
            fi
          done
          
          CURRENT_VERSION=${LAST_TAG#v}
          NEW_VERSION=$CURRENT_VERSION
          if [[ $MAJOR -eq 1 ]]; then
            NEW_VERSION=$(semver -i major $CURRENT_VERSION)
          elif [[ $MINOR -eq 1 ]]; then
            NEW_VERSION=$(semver -i minor $CURRENT_VERSION)
          elif [[ $PATCH -eq 1 ]]; then
            NEW_VERSION=$(semver -i patch $CURRENT_VERSION)
          fi
          
          echo "Nova versão: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_ENV

      - name: Atualizar versão no package.json
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/story-book'
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if [ "$CURRENT_VERSION" = "${{ env.new_version }}" ]; then
            echo "Versão já está atual. Pulando atualização."
          else
            npm version ${{ env.new_version }} --no-git-tag-version
          fi  

      - name: Commit e push
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/story-book'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add package.json
          
          # Só faz commit se houver mudanças no package.json
          if git diff --cached --quiet; then
            echo "Sem mudanças para commitar."
          else
            git commit -m "chore(release): version ${{ env.new_version }}"
          fi

          # Só cria a tag se ela não existir
          if git rev-parse v${{ env.new_version }} >/dev/null 2>&1; then
            echo "Tag v${{ env.new_version }} já existe."
          else
            git tag v${{ env.new_version }}
          fi
          
          git push origin HEAD --tags

      # 🐳 DOCKER BUILD & PUSH (Para Main)
      - name: Build and Push Docker Image (Main)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/notagest-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/notagest-backend:v${{ env.new_version }}

      # 🐳 DOCKER BUILD & PUSH (Para Development)
      - name: Build and Push Docker Image (Development)
        if: github.ref == 'refs/heads/development' || github.ref == 'refs/heads/feat/story-book'
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/notagest-backend:dev

      - name: Enviar e-mail de falha
        uses: dawidd6/action-send-mail@v3
        if: failure()
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_ORIGEM }}
          password: ${{ secrets.SENHA_EMAIL }}
          subject: Falha no Pipeline Backend - ${{ github.repository }}
          to: ${{ secrets.EMAIL_DESTINO }}
          from: ${{ secrets.EMAIL_ORIGEM }}

  deploy-hml:
    name: Deploy - Homologação (HML)
    needs: ci-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development' || github.ref == 'refs/heads/feat/story-book'
    environment:
      name: hml
    runs-on: ubuntu-latest
    steps:
      - name: Trigger HML Deploy Hook
        run: |
          echo "Disparando deploy para o ambiente de Homologação (HML)..."
          # curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_HML }}"

  deploy-prod:
    name: Deploy - Produção (PROD)
    needs: [ci-test, deploy-hml]
    if: github.ref == 'refs/heads/main'
    environment:
      name: prod
    runs-on: ubuntu-latest
    steps:
      - name: Trigger PROD Deploy Hook
        run: |
          echo "Disparando deploy para o ambiente de Produção (PROD)..."
          # curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_PROD }}"
